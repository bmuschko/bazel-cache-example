name: Bazel cache demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  local-caches:
    name: In-memory and on-disk caches (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: "Step 1: Cold build"
        run: |
          bazelisk clean --expunge
          rm -rf ~/.cache/bazel-cache-example/disk-cache
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 3 0 0

      - name: "Step 2: Rebuild in the same server (in-memory)"
        run: |
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 0 0 0

      - name: "Step 3: Rebuild after a server restart (local action cache)"
        run: |
          bazelisk shutdown
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 0 3 0

      - name: "Step 4: Rebuild after a full clean (disk cache)"
        run: |
          bazelisk clean --expunge
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 0 0 3

      - name: "Step 5: Change one input"
        run: |
          echo 'Howdy' > data/greeting.txt
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 2 0 0

      - name: "Step 6: Revert the change"
        run: |
          echo 'Hello' > data/greeting.txt
          git diff --exit-code data/greeting.txt
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 0 0 2

  populate-disk-cache:
    name: Populate on-disk cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true
      - name: Build with an empty disk cache
        run: |
          bazelisk clean --expunge
          rm -rf ~/.cache/bazel-cache-example/disk-cache
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 3 0 0
      - name: Save disk cache
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bazel-cache-example/disk-cache
          key: bazel-disk-cache-${{ github.run_id }}-${{ github.run_attempt }}

  reuse-disk-cache:
    name: Reuse on-disk cache on a fresh runner
    needs: populate-disk-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true
      - name: Restore disk cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bazel-cache-example/disk-cache
          key: bazel-disk-cache-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: "Sharing the disk cache across machines"
        run: |
          bazelisk clean --expunge
          bazelisk build --config=disk //:report 2>&1 | tee build.log
          ./scripts/verify-build.sh build.log 0 0 3
